<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Frame Seeker - Initial State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#c2c5c7",
                        "surface-container": "#eeeef0",
                        "on-primary-container": "#005870",
                        "secondary": "#0058bc",
                        "secondary-fixed-dim": "#adc6ff",
                        "inverse-on-surface": "#f0f0f3",
                        "surface-bright": "#f9f9fc",
                        "background": "#f9f9fc",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#d8e2ff",
                        "surface": "#f9f9fc",
                        "on-primary-fixed": "#001f29",
                        "inverse-surface": "#2f3133",
                        "on-surface-variant": "#3f484c",
                        "outline-variant": "#bfc8cd",
                        "surface-container-highest": "#e2e2e5",
                        "error": "#ba1a1a",
                        "primary": "#0c6780",
                        "on-error": "#ffffff",
                        "primary-container": "#87ceeb",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "tertiary-fixed": "#e0e3e5",
                        "surface-container-low": "#f3f3f6",
                        "secondary-container": "#0070eb",
                        "outline": "#6f787d",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#5c5f61",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#004d62",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#89d0ed",
                        "surface-container-high": "#e8e8ea",
                        "on-tertiary-fixed": "#191c1e",
                        "on-tertiary-container": "#4e5254",
                        "on-background": "#1a1c1e",
                        "on-primary": "#ffffff",
                        "on-surface": "#1a1c1e",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#fefcff",
                        "primary-fixed-dim": "#89d0ed",
                        "surface-variant": "#e2e2e5",
                        "surface-dim": "#dadadc",
                        "on-secondary-fixed-variant": "#004493",
                        "on-tertiary-fixed-variant": "#444749",
                        "surface-tint": "#0c6780",
                        "on-secondary-fixed": "#001a41",
                        "primary-fixed": "#baeaff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sidebar-width": "320px",
                        "stack-gap": "12px",
                        "topbar-height": "64px",
                        "container-padding": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "mono-sm": ["JetBrains Mono"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "mono-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9fc;
        }
        /* Custom scrollbar for sidebar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #bfc8cd;
            border-radius: 4px;
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #87ceeb;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #87ceeb;
        }
    </style>
</head>
<body class="text-on-surface h-screen overflow-hidden flex">
<!-- Sidebar (A) -->
<aside class="bg-surface-container-low dark:bg-surface-container-highest border-r border-outline-variant dark:border-outline flex flex-col p-stack-gap h-screen overflow-y-auto w-sidebar-width flex-shrink-0 z-10 custom-scrollbar">
<!-- Brand Header -->
<div class="mb-6 flex items-center justify-between">
<div>
<h1 class="font-headline-sm text-headline-sm font-black tracking-tight text-on-surface">Frame Seeker</h1>
</div>
</div>
<!-- Video ID Search -->
<div class="mb-4">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-outline" style="font-size: 16px;">movie</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Video ID Search</span>
</div>
<input class="w-full bg-surface-container-lowest border-b border-outline-variant focus:border-primary focus:ring-0 px-3 py-2 font-body-sm text-body-sm rounded-t-DEFAULT" placeholder="Enter Video ID (e.g., K01_V001)" type="text"/>
</div>
<!-- Query Search Mode -->
<div class="mb-4 pb-4 border-b border-outline-variant">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-outline" style="font-size: 16px;">search</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Query Search Mode</span>
</div>
<div class="flex items-center justify-between mb-3">
<span class="font-label-sm text-label-sm text-on-surface-variant">Sort By</span>
<select class="bg-surface-container-lowest border border-outline-variant rounded px-2 py-1 font-body-sm text-body-sm pr-8 focus:ring-primary focus:border-primary">
<option>Frame ID</option>
<option>Score</option>
</select>
</div>
<div class="flex items-center justify-between">
<span class="font-label-sm text-label-sm text-on-surface-variant">Top K</span>
<input class="w-20 bg-surface-container-lowest border border-outline-variant rounded px-2 py-1 font-body-sm text-body-sm focus:ring-primary focus:border-primary" type="number" value="100"/>
</div>
</div>
<!-- Queries Section -->
<div class="flex items-center justify-between mb-3">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Queries</span>
<button class="text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 18px;">add</span>
</button>
</div>
<!-- Query Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg shadow-sm mb-4">
<!-- Card Header -->
<div class="flex items-center justify-between p-2 border-b border-outline-variant bg-surface-container-low rounded-t-lg">
<!-- Toggle -->
<div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer transition-colors duration-200 ease-in-out z-10 checked:right-0 checked:border-primary-container" id="toggle1" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-5 rounded-full bg-primary-container cursor-pointer transition-colors duration-200 ease-in-out" for="toggle1"></label>
</div>
<div class="flex items-center gap-1">
<button class="text-outline hover:text-on-surface p-1">
<span class="material-symbols-outlined" style="font-size: 16px;">drag_indicator</span>
</button>
<button class="text-outline hover:text-primary p-1">
<span class="material-symbols-outlined" style="font-size: 16px;">image</span>
</button>
<button class="text-outline hover:text-error p-1">
<span class="material-symbols-outlined" style="font-size: 16px;">delete</span>
</button>
</div>
</div>
<!-- Card Body -->
<div class="p-2">
<textarea class="w-full border-none resize-none focus:ring-0 p-0 font-body-sm text-body-sm text-on-surface" placeholder="Enter text query..." rows="3"></textarea>
</div>
<!-- Card Footer -->
<div class="bg-surface-container-low rounded-b-lg border-t border-outline-variant">
<div class="px-2 py-1.5 flex items-center gap-2 border-b border-outline-variant cursor-pointer hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-outline" style="font-size: 14px;">sell</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Tags</span>
</div>
<div class="px-2 py-1.5 flex items-center gap-2 cursor-pointer hover:bg-surface-container-high transition-colors rounded-b-lg">
<span class="material-symbols-outlined text-outline" style="font-size: 14px;">key</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Keywords</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-2 mt-auto pt-4">
<button class="flex-1 border border-outline-variant bg-surface-container-lowest text-on-surface font-label-md text-label-md py-2 rounded-DEFAULT hover:bg-surface-container-high transition-colors">Clear</button>
<button class="flex-1 bg-primary-container text-on-primary-container font-label-md text-label-md py-2 rounded-DEFAULT hover:bg-opacity-90 transition-colors">Enter</button>
</div>
<!-- Decorative Logo Bottom Left -->
<div class="mt-4 flex justify-center">
<div class="w-8 h-8 rounded-full bg-error-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-error-container" style="font-size: 20px;">camera</span>
</div>
</div>
</aside>
<!-- Main Wrapper -->
<div class="flex-1 flex flex-col h-screen overflow-hidden bg-background">
<!-- Top Bar (C) -->
<header class="bg-surface-container-lowest dark:bg-surface-dim border-b border-outline-variant dark:border-outline flex justify-between items-center px-container-padding w-full h-16 flex-shrink-0 z-10">
<!-- Left: Global Controls -->
<div class="flex items-center gap-6">
<!-- Radio Group -->
<div class="flex items-center gap-4">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="text-primary focus:ring-primary border-outline-variant" name="search_type" type="radio"/>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Track</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<input checked="" class="text-primary focus:ring-primary border-outline-variant" name="search_type" type="radio"/>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">QA</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<input class="text-primary focus:ring-primary border-outline-variant" name="search_type" type="radio"/>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">KIS</span>
</label>
</div>
<!-- Input Fields -->
<div class="flex items-center gap-2">
<input class="w-24 bg-surface-container-low border-b border-outline-variant focus:border-primary focus:ring-0 px-3 py-1.5 font-body-sm text-body-sm rounded-t-DEFAULT" placeholder="Frame ID" type="text"/>
<input class="w-24 bg-surface-container-low border-b border-outline-variant focus:border-primary focus:ring-0 px-3 py-1.5 font-body-sm text-body-sm rounded-t-DEFAULT" placeholder="Video ID" type="text"/>
<input class="w-24 bg-surface-container-low border-b border-outline-variant focus:border-primary focus:ring-0 px-3 py-1.5 font-body-sm text-body-sm rounded-t-DEFAULT" placeholder="Time (ms)" type="text"/>
<input class="w-32 bg-surface-container-low border-b border-outline-variant focus:border-primary focus:ring-0 px-3 py-1.5 font-body-sm text-body-sm rounded-t-DEFAULT" placeholder="Answer" type="text"/>
</div>
</div>
<!-- Right: Actions -->
<div class="flex items-center gap-3">
<button class="bg-primary-container text-on-primary-container font-label-md text-label-md px-4 py-1.5 rounded-DEFAULT hover:bg-opacity-90 transition-colors">Submit</button>
<button class="border border-outline-variant bg-surface-container-lowest text-on-surface-variant font-label-md text-label-md px-3 py-1.5 rounded-DEFAULT hover:bg-surface-container-high transition-colors flex items-center gap-2">
<span class="material-symbols-outlined" style="font-size: 16px;">settings</span>
                    DRES Settings
                </button>
</div>
</header>
<!-- Main Content Canvas (B) -->
<main class="flex-1 overflow-y-auto p-container-padding relative flex items-center justify-center">
<!-- Empty State / Start Searching -->
<div class="text-center max-w-md">
<h2 class="font-headline-sm text-headline-sm font-bold text-on-surface mb-2">Start Searching</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Use the filters on the left and press "Enter" to see results.</p>
</div>
</main>
</div>
</body></html>
