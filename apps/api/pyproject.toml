[project]
name = "frameseeker-api"
version = "0.1.0"
description = "FrameSeeker Flask API for AI Challenge 2026"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pymilvus>=2.4",
    "elasticsearch>=8.0,<9",
    "open-clip-torch>=2.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "Pillow>=10.0",
    "gunicorn>=22.0",
    "polars>=1.43.2",
    "transformers>=4.40,<5",
    "sentencepiece>=0.1.99",
    "torchscale>=0.3.0",
    "fairscale>=0.4.13",
    "timm>=1.0.17",
    "minio>=7.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
]

# torchscale pins fairscale==0.4.0 and timm==0.6.13 on PyPI; both are years out
# of date and conflict with open-clip-torch's timm>=1.0.17. torchscale's actual
# imports (trunc_normal_, register_model, fairscale.nn.{checkpoint_wrapper,wrap})
# are stable across these versions, so the pins are overridden rather than honoured.
[tool.uv]
override-dependencies = ["timm>=1.0.17", "fairscale>=0.4.13"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true

# These packages ship no type information.
[[tool.mypy.overrides]]
module = ["pymilvus.*", "open_clip.*", "flask_cors.*", "torchscale.*", "fairscale.*", "timm.*", "transformers.*", "sentencepiece.*", "torchvision.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
