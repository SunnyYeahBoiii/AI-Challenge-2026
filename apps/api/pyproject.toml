[project]
name = "frameseeker-api"
version = "0.1.0"
description = "FrameSeeker Flask API for AI Challenge 2026"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pymilvus>=2.4",
    "elasticsearch>=8.0,<9",
    "openai>=1.0",
    "open-clip-torch>=2.0",
    "torch>=2.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
models = [
    "transformers>=4.56.2",
    "safetensors>=0.4",
    "sentence-transformers[image]>=5.2.0",
    "sentencepiece>=0.2.0",
    "timm>=1.0.15",
    "torchscale==0.2.0",
    "torchvision>=0.15",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
# TorchScale pins timm 0.4.12 for unrelated training utilities. FrameSeeker only imports
# TorchScale's BEiT-3 modules, while Perception Encoder requires the current timm PE model.
override-dependencies = ["timm>=1.0.15"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts", "tests", "gunicorn.conf.py"]

[[tool.mypy.overrides]]
module = [
    "open_clip.*",
    "pymilvus.*",
    "elasticsearch.*",
    "openai.*",
    "transformers.*",
    "sentence_transformers.*",
    "sentencepiece.*",
    "timm.*",
    "torchscale.*",
    "torchvision.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.routes.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
