[project]
name = "frameseeker-api"
version = "0.1.0"
description = "FrameSeeker Flask API for AI Challenge 2026"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pymilvus>=2.4",
    "elasticsearch>=8.0,<9",
    "openai>=1.0",
    "open-clip-torch>=2.0",
    "torch>=2.0",
    "numpy>=1.24",
    "ijson>=3.3",
    "Pillow>=10.0",
    "gunicorn>=22.0",
    "polars>=1.43.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true

# These packages ship no type information.
[[tool.mypy.overrides]]
module = ["pymilvus.*", "open_clip.*", "flask_cors.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
