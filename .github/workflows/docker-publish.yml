name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: sunnyyeahboiii/ai-challenge-2026/api
            context: .
            file: ./apps/api/Dockerfile
          - image: sunnyyeahboiii/ai-challenge-2026/web
            context: .
            file: ./apps/web/Dockerfile
          - image: sunnyyeahboiii/ai-challenge-2026/cloud-api
            context: .
            file: ./apps/cloud-api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-cloud-api:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy cloud-api over Tailscale SSH
        env:
          TAG: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          DEPLOY_HOST: sunny.tail338c9c.ts.net
        run: |
          SHORT_TAG=${TAG:0:7}
          ssh -o StrictHostKeyChecking=accept-new "sunny@${DEPLOY_HOST}" bash -s <<EOF
            set -euo pipefail
            docker login ghcr.io -u "${GH_ACTOR}" --password-stdin <<< "${GH_TOKEN}"
            cd /home/sunny/cloud-api
            TAG=${SHORT_TAG} docker compose pull
            TAG=${SHORT_TAG} docker compose up -d
            curl -fsS --retry 10 --retry-delay 2 --retry-all-errors http://localhost:5002/boards/shared > /dev/null
            docker image prune -f
          EOF
