services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://api:5000
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:5000

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./apps/api/.env
    volumes:
      - ./apps/api/app:/app/app
    develop:
      watch:
        - action: sync
          path: ./apps/api/app
          target: /app/app
