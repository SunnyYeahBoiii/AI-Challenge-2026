services:
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        API_BASE_URL: http://api:5000
        NEXT_PUBLIC_CLOUD_API_URL: http://cloud-api:5002
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:5000
      - NEXT_PUBLIC_CLOUD_API_URL=http://cloud-api:5002

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports:
      - "5001:5000"
    env_file:
      - ./apps/api/.env
    environment:
      - MILVUS_URI=http://milvus:19530
      - ES_URL=http://elasticsearch:9200
      - HF_HOME=/root/.cache/huggingface
    depends_on:
      milvus:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/weights:/app/weights:ro
      - ./data/objects:/app/data/objects:ro
      - ./data/media-info:/app/data/media-info:ro
      - hf_cache:/root/.cache/huggingface
    develop:
      watch:
        - action: sync
          path: ./apps/api/app
          target: /app/app

  cloud-api:
    build:
      context: .
      dockerfile: ./apps/cloud-api/Dockerfile
    ports:
      - "5002:5002"
    env_file:
      - ./apps/cloud-api/.env
    environment:
      - CLOUD_API_PORT=5002
    volumes:
      - ./apps/cloud-api/data:/app/apps/cloud-api/data

  milvus:
    image: milvusdb/milvus:v2.4.17
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - ETCD_USE_EMBED=true
      - COMMON_STORAGETYPE=local

  elasticsearch:
    image: elasticsearch:8.12.0
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

  kibana:
    image: kibana:8.12.0
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

  attu:
    image: zilliz/attu:latest
    ports:
      - "3001:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_healthy

volumes:
  milvus_data:
  es_data:
  hf_cache:
