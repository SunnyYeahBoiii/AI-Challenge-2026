services:
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        API_BASE_URL: http://api:5000
        # Baked into the browser bundle — must be reachable from each user's
        # browser (host LAN/Tailscale IP), not a docker-internal hostname.
        NEXT_PUBLIC_CLOUD_API_URL: ${NEXT_PUBLIC_CLOUD_API_URL:-http://localhost:5002}
        NEXT_PUBLIC_DRES_SESSION_ID: ${NEXT_PUBLIC_DRES_SESSION_ID:-}
        NEXT_PUBLIC_DRES_USERNAME: ${NEXT_PUBLIC_DRES_USERNAME:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:5000
      - NEXT_PUBLIC_CLOUD_API_URL=${NEXT_PUBLIC_CLOUD_API_URL:-http://localhost:5002}
      - NEXT_PUBLIC_DRES_SESSION_ID=${NEXT_PUBLIC_DRES_SESSION_ID:-}
      - NEXT_PUBLIC_DRES_USERNAME=${NEXT_PUBLIC_DRES_USERNAME:-}

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports:
      - "5001:5000"
    env_file:
      - ./apps/api/.env
    environment:
      - MILVUS_URI=http://milvus:19530
      - ES_URL=http://elasticsearch:9200
      - HF_HOME=/root/.cache/huggingface
    depends_on:
      milvus:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/weights:/app/weights
      - ./data/objects:/app/data/objects:ro
      - ./data/media-info:/app/data/media-info:ro
      - ./data/keyframes:/app/data/keyframes:ro
      - ./data/video:/app/data/video:ro
      - hf_cache:/root/.cache/huggingface
    develop:
      watch:
        - action: sync
          path: ./apps/api/app
          target: /app/app

  cloud-api:
    build:
      context: .
      dockerfile: ./apps/cloud-api/Dockerfile
    ports:
      - "5002:5002"
    env_file:
      - ./apps/cloud-api/.env
    environment:
      - CLOUD_API_PORT=5002
    volumes:
      - ./apps/cloud-api/data:/app/apps/cloud-api/data

  milvus:
    image: milvusdb/milvus:v2.4.17
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    # Milvus 2.4 derives its memory budget from the cgroup limit, so this is what
    # actually stops it growing: without it, Milvus believes it owns the whole
    # 11.67 GB Docker VM, fills it, and Docker balloons into swap until macOS
    # cannot run the window server. Measured steady state is ~2.8 GB, so 4 GB
    # leaves headroom. Exceeding it OOM-kills milvus, which is recoverable;
    # freezing the host is not.
    mem_limit: 4g
    # memswap_limit == mem_limit is what disables swap. Docker's default is
    # 2x mem_limit, which would let Milvus balloon into 4 GB of swap — the exact
    # mechanism that made the host unresponsive. Hit the cap and the kernel
    # OOM-kills Milvus instead.
    memswap_limit: 4g
    mem_reservation: 2g
    restart: unless-stopped
    volumes:
      - milvus_data:/var/lib/milvus
      - milvus_metadata:/milvus/default.etcd
      # Sizes Milvus's own caches for the mem_limit budget above.
      - ./data/milvus-user.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - ETCD_USE_EMBED=true
      - COMMON_STORAGETYPE=local

  elasticsearch:
    image: elasticsearch:8.12.0
    ports:
      - "9200:9200"
    # Heap is pinned at 512 MB, but Lucene mmaps the index off-heap and that
    # counts too. Cap the container so ES cannot creep up with segment count,
    # and disable swap for the same reason as milvus.
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 1g
    restart: unless-stopped
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # Defaults to 10% of heap per shard; at ~350k docs the index has enough
      # segments to hold the ceiling open, and the buffer is off-heap.
      - indices.memory.index_buffer_size=10%
      - indices.memory.max_index_buffer_size=64mb

  # Debug tooling only. The app never calls these; together they cost ~670 MB,
  # which is a third of the free memory on a 16 GB host. Start with:
  #   docker compose --profile debug up -d kibana attu
  kibana:
    image: kibana:8.12.0
    profiles: ["debug"]
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

  # Same rationale as kibana. Attu is the Milvus collection browser.
  attu:
    image: zilliz/attu:latest
    profiles: ["debug"]
    ports:
      - "3001:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      milvus:
        condition: service_healthy

volumes:
  milvus_data:
  milvus_metadata:
  es_data:
  hf_cache:
